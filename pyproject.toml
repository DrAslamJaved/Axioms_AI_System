[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axioms-ai-system"
version = "0.2.0"
description = "Human-governed multi-agent research and teaching assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]
agentic = ["anthropic>=0.39", "openai>=1.50"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["axioms*"]

services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - axioms_data:/app/data
    restart: unless-stopped

  ui:
    build: .
    env_file: .env
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  axioms_data:

